[pytest]
addopts = --import-mode=importlib
pythonpath =
    apps/core/domain-service
    apps/sim/official-sim-server
    apps/sim/user-sim-service
testpaths =
    tests
    apps/core/domain-service/tests
    apps/sim/official-sim-server/tests
    apps/sim/user-sim-service/tests
norecursedirs =
    .*
    __pycache__
    .git
    .venv
    .beads
    node_modules
    reference
